# EDU RAG — Portable Version
# Hybrid Online (GPT-5-nano) / Offline (Ollama LLM, CPU-only)
# Target: laptop with Intel Core i5, 8GB RAM
#
# Secrets are loaded from .env (copy .env.example -> .env and fill in values).

version: '3.8'

services:
  pg-rag:
    image: pgvector/pgvector:pg16
    container_name: pg-rag
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 6G  # CPU-only LLM inference

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required - copy .env.example to .env}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - pg-rag
      - ollama

volumes:
  pgdata:
    external: true
    name: edu-rag-demo_pgdata
  ollama_data:
  n8n_data:
